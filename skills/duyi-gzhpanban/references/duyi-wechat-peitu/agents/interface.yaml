interface:
  display_name: "公众号配图"
  short_description: "生成公众号封面、首图与正文插图，支持商业编辑插画、小黑和动画电影海报式人物图。"
  default_prompt: "Use $duyi-wechat-peitu to generate WeChat covers and body illustrations in the right style."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "claude"
    - "openai"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    claude: "neutral-source-plus-adapter"
    openai: "metadata-adapter"
    generic: "neutral-source"
